# Security headers applied to every response.
#
# The file is included both in the ``server`` block and in the locations
# that add their own headers.  Nginx drops the inherited ``add_header``
# directives as soon as a location declares one of its own, so a location
# without this include would serve its responses without the protection.

include /etc/nginx/nginx-base-headers.conf;

# Turn off the features that are not used by the dashboard and that are a
# common source of cross-site scripting.  The web fonts are loaded from
# Google Fonts and the inline icons are embedded as data URIs, so both
# hosts have to be allowed explicitly.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
