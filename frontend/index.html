<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Review AI Dashboard</title>
    <meta
      name="description"
      content="Submit customer feedback and manage AI-assisted review analysis in the operations dashboard."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/theme-init.js"></script>
    <!-- Fonts: connect early and load once for every view, instead of a
         render-blocking @import inside each lazily loaded view.  Noto Color
         Emoji draws the language flags where the system has none (Windows);
         a font file is fetched only when a page actually shows a flag. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Exo+2:wght@600;700&family=Inter:wght@400;500;600&family=Noto+Color+Emoji&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
