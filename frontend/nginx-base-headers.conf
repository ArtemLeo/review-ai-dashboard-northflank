# Security headers shared by every location, without the Content-Security-
# Policy.  nginx-headers.conf adds the strict policy of the application, and
# the /docs location adds its own relaxed one, so both stay in sync.

# Do not allow the site to be embedded in a frame (clickjacking).
add_header X-Frame-Options "DENY" always;

# Do not let the browser sniff the content type.
add_header X-Content-Type-Options "nosniff" always;

# Do not leak the referrer of the admin panel to third parties.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Switch off the browser features the site does not use.  The microphone is
# allowed for this origin only: the review form uses it for voice typing, and
# an empty list (microphone=()) would make the browser refuse it for everyone.
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

# Make browsers use HTTPS only, for a year.  The platform terminates TLS in
# front of nginx; over plain HTTP, as in a local run, browsers ignore it.
add_header Strict-Transport-Security "max-age=31536000" always;
