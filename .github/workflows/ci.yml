name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt ruff==0.17.2 mypy==2.4.0
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app main.py scripts

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint . --max-warnings 0
      - run: npm run format:check
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Start the application stack
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Check the public endpoints and admin session
        run: |
          curl --fail --silent --show-error http://localhost:8080/health \
            | grep --fixed-strings '"status":"healthy"'
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/

          cookie_jar="$(mktemp)"
          trap 'rm -f "$cookie_jar"' EXIT
          curl --fail --silent --show-error \
            --cookie-jar "$cookie_jar" \
            --header 'Content-Type: application/json' \
            --data '{"email":"admin-artem-leo","password":"password-artem-leo"}' \
            http://localhost:8080/api/auth/login \
            | grep --fixed-strings '"email":"admin-artem-leo"'
          curl --fail --silent --show-error \
            --cookie "$cookie_jar" \
            http://localhost:8080/api/auth/me \
            | grep --fixed-strings '"email":"admin-artem-leo"'
      - name: Show container logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
